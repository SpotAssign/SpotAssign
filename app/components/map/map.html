<div>
<div id="currentMap"
	 class="{{ map.mapType }}"
	 style="background: url( {{ map.mapImage }} );background-size: contain;background-repeat:no-repeat;"
>

	<div ng-repeat="spot in map.spots">
		<a ng-click="vm.clickTheSpot( spot, spot.$$hashKey )">
			<div style="position:absolute;background-color:{{spot.color}};left:{{spot.left}};top:{{spot.top}};width:{{spot.width}};height:{{spot.height}}"
				class="{{spot.type}} spot"
			>
				<p class="spotPrice"><span id="dollar">$</span>{{spot.price}}</p>
			</div>
		</a>
	</div>

</div>
<div class = "col s6">
<div class="outside-map" ng-show="vm.clickedSpot; !vm.payment">
	<h5>Available Date: </h5>
	<h5>Price: ${{ vm.clickedSpot.price }}</h5>
	<button ng-show="vm.showButton" ng-click="vm.buySpot()">Book Now</button>
</div>
<div class="payment" ng-show="vm.payment">
	<div>
		<h5>Dates:</h5>
		<h5>Price:</h5>
		<h5>Total: </h5>
		<button ng-click="vm.payment = false; vm.clickedSpot = true">Back</button>
		<button>Pay</button>
	</div>
</div>

</div>

</div>
